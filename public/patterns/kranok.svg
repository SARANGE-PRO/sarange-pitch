<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="lattice" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round">
        <!-- Treillis d'arcs entrecroisés (lai thai) — tuile sans couture -->
        <circle cx="0" cy="0" r="42" />
        <circle cx="120" cy="0" r="42" />
        <circle cx="0" cy="120" r="42" />
        <circle cx="120" cy="120" r="42" />
        <circle cx="60" cy="60" r="42" />
        <circle cx="60" cy="0" r="42" />
        <circle cx="0" cy="60" r="42" />
        <circle cx="120" cy="60" r="42" />
        <circle cx="60" cy="120" r="42" />
        <!-- Fleurons kranok stylisés aux nœuds -->
        <path d="M60 44 q7 9 0 20 q-7 -11 0 -20 Z" stroke-width="1" />
        <path d="M60 4 q7 9 0 20 q-7 -11 0 -20 Z" stroke-width="1" />
        <path d="M60 84 q7 9 0 20 q-7 -11 0 -20 Z" stroke-width="1" />
        <circle cx="60" cy="60" r="3.2" stroke-width="1" />
        <circle cx="0" cy="0" r="3.2" stroke-width="1" />
        <circle cx="120" cy="120" r="3.2" stroke-width="1" />
      </g>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#lattice)" />
</svg>
